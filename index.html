<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kawiarnia "Aroma POS"</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        coffee: {
                            50: '#fdfbf7',
                            100: '#f5efe6',
                            200: '#e8dcc4',
                            600: '#8c6239',
                            700: '#6f4e37',
                            800: '#523a28',
                            900: '#3d2b1f',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        body {
            user-select: none;
            -webkit-user-select: none;
            background-color: #f5efe6;
            color: #3d2b1f;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col text-xs">

    <header class="bg-coffee-900 text-white h-11 flex items-center justify-between px-3 shadow-md z-10 shrink-0">
        <div class="flex items-center space-x-2">
            <div class="bg-coffee-700 p-1 rounded text-amber-200">
                <i class="fa-solid fa-mug-hot text-xs"></i>
            </div>
            <div>
                <h1 class="text-[11px] font-bold tracking-wide">Kawiarnia "Aroma POS"</h1>
                <p class="text-[8px] text-amber-200/80 flex items-center gap-1">
                    <span id="current-time"></span> | 
                    <span class="bg-emerald-600 text-white px-1 rounded text-[7px] font-semibold">Stan: Online</span>
                </p>
            </div>
        </div>

        <div class="flex bg-coffee-800 p-0.5 rounded-lg space-x-1">
            <button onclick="switchTab('pos')" id="tab-btn-pos" class="px-2.5 py-0.5 rounded font-medium transition-all bg-coffee-600 text-white shadow text-[10px]">
                <i class="fa-solid fa-cash-register mr-1"></i> Kasa / Menu
            </button>
            <button onclick="switchTab('history')" id="tab-btn-history" class="px-2.5 py-0.5 rounded font-medium transition-all text-coffee-200 hover:text-white text-[10px]">
                <i class="fa-solid fa-clock-rotate-left mr-1"></i> Historia Zamówień
            </button>
        </div>

        <div class="flex items-center space-x-2">
            <div class="text-right">
                <p class="font-medium text-[10px]">Barista: Jan</p>
                <p class="text-[8px] text-amber-200/70">Terminal #1 (iPad)</p>
            </div>
            <button onclick="openDaySummaryModal()" class="bg-coffee-700 hover:bg-coffee-600 text-amber-100 p-1.5 rounded transition" title="Podsumowanie dnia">
                <i class="fa-solid fa-chart-line text-[11px]"></i>
            </button>
        </div>
    </header>

    <main class="flex-1 flex overflow-hidden relative">

        <div id="view-pos" class="flex-1 flex overflow-hidden">
            
            <div class="flex-1 flex flex-col p-2 overflow-hidden border-r border-coffee-200">
                <div class="mb-1.5 space-y-1 shrink-0">
                    <div class="relative">
                        <i class="fa-solid fa-search absolute left-3 top-2 text-coffee-600 text-[10px]"></i>
                        <input type="text" id="search-input" oninput="filterMenu()" placeholder="Szukaj produktu..." 
                            class="w-full pl-8 pr-3 py-1 bg-white border border-coffee-200 rounded-lg focus:outline-none focus:border-coffee-600 shadow-sm text-[11px]">
                    </div>

                    <div id="category-container" class="flex space-x-1 overflow-x-auto no-scrollbar pb-0.5"></div>
                </div>

                <div class="flex-1 overflow-y-auto pr-0.5">
                    <div id="product-grid" class="grid grid-cols-5 gap-1.5 pb-1"></div>
                </div>
            </div>

            <div class="w-[300px] bg-white flex flex-col h-full shadow-lg shrink-0">
                <div class="p-2 border-b border-coffee-100 flex justify-between items-center bg-coffee-50 shrink-0">
                    <h2 class="font-bold text-coffee-900 flex items-center text-[10px]">
                        <i class="fa-solid fa-receipt mr-1 text-coffee-600"></i> Bieżące Zamówienie
                    </h2>
                    <button onclick="clearCart()" class="text-[9px] text-red-600 hover:text-red-800 font-medium px-1.5 py-0.5 bg-red-50 rounded transition">
                        <i class="fa-solid fa-trash-can mr-0.5"></i> Wyczyść
                    </button>
                </div>

                <div id="cart-items" class="flex-1 overflow-y-auto p-1.5 space-y-1">
                    <div class="text-center text-coffee-600/60 py-6 flex flex-col items-center justify-center">
                        <i class="fa-solid fa-mug-saucer text-xl mb-1 text-coffee-200"></i>
                        <p class="font-medium text-[10px]">Koszyk jest pusty</p>
                    </div>
                </div>

                <div class="p-2 border-t border-coffee-100 bg-coffee-50 space-y-1.5 shrink-0">
                    <div class="flex justify-between font-bold text-xs text-coffee-900 pt-0.5">
                        <span>Do zapłaty:</span>
                        <span id="cart-total" class="text-coffee-700 text-sm">0.00 zł</span>
                    </div>

                    <div>
                        <button onclick="checkout('Gotówka')" class="w-full py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-lg transition shadow flex items-center justify-center text-[10px]">
                            <i class="fa-solid fa-money-bill-wave mr-1 text-xs"></i> Zamów i Opłać (Gotówka)
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div id="view-history" class="flex-1 flex flex-col p-2.5 overflow-hidden hidden bg-[#f5efe6]">
            <div class="flex justify-between items-center mb-2 bg-white p-2 rounded-lg shadow-sm border border-coffee-200 shrink-0">
                <div class="flex items-center space-x-2">
                    <h2 class="font-bold text-coffee-900 flex items-center text-xs">
                        <i class="fa-solid fa-list-check mr-1 text-coffee-600"></i> Historia Zamówień
                    </h2>
                    <div class="relative">
                        <i class="fa-solid fa-filter absolute left-2 top-1.5 text-coffee-600 text-[9px]"></i>
                        <input type="text" id="history-search" oninput="filterHistory()" placeholder="Szukaj po ID lub pozycji..." 
                            class="pl-6 pr-2 py-0.5 bg-coffee-50 border border-coffee-200 rounded focus:outline-none focus:border-coffee-600 w-44 text-[10px]">
                    </div>
                </div>

                <div class="flex items-center space-x-1">
                    <button onclick="exportToCSV()" class="px-2 py-0.5 bg-emerald-700 hover:bg-emerald-800 text-white font-medium rounded transition flex items-center text-[10px] shadow-sm">
                        <i class="fa-solid fa-file-excel mr-1"></i> Eksport CSV
                    </button>
                    <button onclick="clearHistory()" class="px-2 py-0.5 bg-red-100 hover:bg-red-200 text-red-700 font-medium rounded transition flex items-center text-[10px]">
                        <i class="fa-solid fa-trash mr-1"></i> Wyczyść historię
                    </button>
                </div>
            </div>

            <div class="flex-1 bg-white rounded-lg shadow-sm border border-coffee-200 overflow-hidden flex flex-col">
                <div class="overflow-y-auto flex-1">
                    <table class="w-full text-left border-collapse">
                        <thead class="bg-coffee-50 text-coffee-900 uppercase font-semibold sticky top-0 border-b border-coffee-200 text-[9px]">
                            <tr>
                                <th class="p-1.5">ID Zamówienia</th>
                                <th class="p-1.5">Godzina</th>
                                <th class="p-1.5">Typ</th>
                                <th class="p-1.5">Pozycje</th>
                                <th class="p-1.5">Płatność</th>
                                <th class="p-1.5 text-right">Wartość</th>
                                <th class="p-1.5 text-center">Akcja</th>
                            </tr>
                        </thead>
                        <tbody id="history-table-body" class="divide-y divide-coffee-100 text-[10px]"></tbody>
                    </table>
                </div>
            </div>
        </div>

    </main>

    <script>
        const menuProducts = [
            { id: 1, name: 'Czarna', price: 6.00, category: 'kawy', image: '☕' },
            { id: 2, name: 'Z mlekiem', price: 10.00, category: 'kawy', image: '🥛' },
            { id: 3, name: 'Mrożona', price: 10.00, category: 'kawy', image: '🧊' },
            { id: 4, name: 'Cappuccino', price: 10.00, category: 'kawy', image: '☕' },
            { id: 5, name: 'Espresso', price: 5.00, category: 'kawy', image: '☕' },
            { id: 6, name: 'Tonik Espresso', price: 10.00, category: 'kawy', image: '🍋' },
            { id: 7, name: 'Latte', price: 10.00, category: 'kawy', image: '🧋' },
            { id: 8, name: 'Cola/Sprite/Fanta 0,5L', price: 6.00, category: 'napoje', image: '🥤' },
            { id: 9, name: 'Cola/Fanta 0,85L', price: 8.00, category: 'napoje', image: '🍾' },
            { id: 10, name: 'Oshee', price: 6.00, category: 'napoje', image: '⚡' },
            { id: 11, name: 'Suchy naleśnik', price: 6.00, category: 'dania', image: '🥞' },
            { id: 12, name: 'Suchy gofr', price: 6.00, category: 'dania', image: '🧇' },
            { id: 13, name: 'Muffinki - 2 szt.', price: 5.00, category: 'dania', image: '🧁' },
            { id: 14, name: 'Ser (twaróg)', price: 3.00, category: 'dodatki', image: '🧀' },
            { id: 15, name: 'Czekolada', price: 3.00, category: 'dodatki', image: '🍫' },
            { id: 16, name: 'Dżem domowy', price: 2.00, category: 'dodatki', image: '🍯' },
            { id: 17, name: 'Banany', price: 4.00, category: 'dodatki', image: '🍌' },
            { id: 18, name: 'Bita śmietana', price: 3.00, category: 'dodatki', image: '🍦' },
            { id: 19, name: 'Syrop klonowy', price: 6.00, category: 'dodatki', image: '🍁' },
            { id: 20, name: 'Cukier puder', price: 1.00, category: 'dodatki', image: '🧂' },
            { id: 21, name: 'Posypka', price: 1.00, category: 'dodatki', image: '✨' },
            { id: 22, name: 'Sosy (różne)', price: 2.00, category: 'dodatki', image: '🍓' },
            { id: 23, name: 'Góralek', price: 3.00, category: 'przekaski', image: '🍫' },
            { id: 24, name: 'Mars / Snickers', price: 4.00, category: 'przekaski', image: '🍫' },
            { id: 25, name: 'Sezamki', price: 3.00, category: 'przekaski', image: '🌾' },
            { id: 26, name: 'Orzeszki ziemne', price: 8.00, category: 'przekaski', image: '🥜' },
            { id: 27, name: 'Paluszki', price: 3.00, category: 'przekaski', image: '🥨' }
        ];

        const categories = [
            { id: 'all', name: 'Wszystkie', icon: 'fa-border-all' },
            { id: 'kawy', name: 'Kawy', icon: 'fa-mug-hot' },
            { id: 'napoje', name: 'Napoje', icon: 'fa-bottle-water' },
            { id: 'dania', name: 'Dania', icon: 'fa-utensils' },
            { id: 'dodatki', name: 'Dodatki', icon: 'fa-plus' },
            { id: 'przekaski', name: 'Przekąski', icon: 'fa-cookie' }
        ];

        let cart = [];
        let currentCategory = 'all';
        let orderHistory = JSON.parse(localStorage.getItem('aroma_pos_history')) || [];

        window.onload = function() {
            updateClock();
            setInterval(updateClock, 1000);
            renderCategories();
            renderProducts(menuProducts);
            renderCart();
            renderHistory();
        };

        function updateClock() {
            const now = new Date();
            document.getElementById('current-time').innerText = now.toLocaleDateString('pl-PL') + ' ' + now.toLocaleTimeString('pl-PL', {hour: '2-digit', minute:'2-digit', second:'2-digit'});
        }

        function switchTab(tab) {
            const posView = document.getElementById('view-pos');
            const historyView = document.getElementById('view-history');
            const posBtn = document.getElementById('tab-btn-pos');
            const historyBtn = document.getElementById('tab-btn-history');

            if (tab === 'pos') {
                posView.classList.remove('hidden');
                historyView.classList.add('hidden');
                posBtn.className = "px-2.5 py-0.5 rounded font-medium transition-all bg-coffee-600 text-white shadow text-[10px]";
                historyBtn.className = "px-2.5 py-0.5 rounded font-medium transition-all text-coffee-200 hover:text-white text-[10px]";
            } else {
                posView.classList.add('hidden');
                historyView.classList.remove('hidden');
                historyBtn.className = "px-2.5 py-0.5 rounded font-medium transition-all bg-coffee-600 text-white shadow text-[10px]";
                posBtn.className = "px-2.5 py-0.5 rounded font-medium transition-all text-coffee-200 hover:text-white text-[10px]";
                renderHistory();
            }
        }

        function renderCategories() {
            const container = document.getElementById('category-container');
            container.innerHTML = categories.map(cat => `
                <button onclick="selectCategory('${cat.id}')" 
                    class="px-2 py-1 rounded font-semibold whitespace-nowrap transition flex items-center space-x-1 shrink-0 text-[10px] ${currentCategory === cat.id ? 'bg-coffee-700 text-white shadow-sm' : 'bg-white text-coffee-800 border border-coffee-200 hover:bg-coffee-100'}">
                    <i class="fa-solid ${cat.icon} text-[8px]"></i>
                    <span>${cat.name}</span>
                </button>
            `).join('');
        }

        function selectCategory(catId) {
            currentCategory = catId;
            renderCategories();
            filterMenu();
        }

        function renderProducts(products) {
            const grid = document.getElementById('product-grid');
            if (products.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-5 text-center py-6 text-coffee-600/60 text-[10px]">
                        <i class="fa-solid fa-box-open text-lg mb-1"></i>
                        <p>Brak produktów</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = products.map(prod => `
                <button onclick="addToCart(${prod.id})" 
                    class="bg-white p-1.5 rounded-lg border border-coffee-200 shadow-sm hover:shadow hover:border-coffee-600 transition flex flex-col justify-between text-left h-16 group">
                    <div class="flex justify-between items-start w-full">
                        <span class="text-xs p-0.5 bg-coffee-50 rounded group-hover:scale-105 transition">${prod.image}</span>
                        <span class="text-[8px] font-bold px-1 bg-coffee-100 text-coffee-900 rounded">${prod.price.toFixed(2)} zł</span>
                    </div>
                    <div>
                        <h3 class="font-bold text-coffee-900 text-[9px] leading-tight line-clamp-2">${prod.name}</h3>
                    </div>
                </button>
            `).join('');
        }

        function filterMenu() {
            const query = document.getElementById('search-input').value.toLowerCase();
            let filtered = menuProducts;

            if (currentCategory !== 'all') {
                filtered = filtered.filter(p => p.category === currentCategory);
            }

            if (query.trim() !== '') {
                filtered = filtered.filter(p => p.name.toLowerCase().includes(query));
            }

            renderProducts(filtered);
        }

        function addToCart(productId) {
            const product = menuProducts.find(p => p.id === productId);
            const existing = cart.find(item => item.id === productId);

            if (existing) {
                existing.qty++;
            } else {
                cart.push({ ...product, qty: 1 });
            }
            renderCart();
        }

        function updateQty(productId, delta) {
            const item = cart.find(i => i.id === productId);
            if (item) {
                item.qty += delta;
                if (item.qty <= 0) {
                    cart = cart.filter(i => i.id !== productId);
                }
            }
            renderCart();
        }

        function clearCart() {
            cart = [];
            renderCart();
        }

        function renderCart() {
            const container = document.getElementById('cart-items');
            
            if (cart.length === 0) {
                container.innerHTML = `
                    <div class="text-center text-coffee-600/60 py-6 flex flex-col items-center justify-center">
                        <i class="fa-solid fa-mug-saucer text-xl mb-1 text-coffee-200"></i>
                        <p class="font-medium text-[10px]">Koszyk jest pusty</p>
                    </div>
                `;
                document.getElementById('cart-total').innerText = '0.00 zł';
                return;
            }

            container.innerHTML = cart.map(item => `
                <div class="flex items-center justify-between p-1 bg-coffee-50/70 rounded border border-coffee-100">
                    <div class="flex-1 pr-1">
                        <p class="font-bold text-coffee-900 leading-snug text-[10px]">${item.name}</p>
                        <p class="text-[8px] text-coffee-600 font-medium">${item.price.toFixed(2)} zł</p>
                    </div>
                    <div class="flex items-center space-x-1">
                        <button onclick="updateQty(${item.id}, -1)" class="w-4 h-4 bg-white border border-coffee-200 rounded flex items-center justify-center text-coffee-800 hover:bg-coffee-100 font-bold text-[9px]">-</button>
                        <span class="font-bold w-3 text-center text-[9px]">${item.qty}</span>
                        <button onclick="updateQty(${item.id}, 1)" class="w-4 h-4 bg-white border border-coffee-200 rounded flex items-center justify-center text-coffee-800 hover:bg-coffee-100 font-bold text-[9px]">+</button>
                    </div>
                    <div class="w-10 text-right font-bold text-[9px] text-coffee-900">
                        ${(item.price * item.qty).toFixed(2)} zł
                    </div>
                </div>
            `).join('');

            const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            document.getElementById('cart-total').innerText = total.toFixed(2) + ' zł';
        }

        function getNextOrderNumber() {
            let lastNumber = parseInt(localStorage.getItem('aroma_pos_last_num')) || 0;
            let nextNum = lastNumber + 1;
            if (nextNum > 20) {
                nextNum = 1;
            }
            localStorage.setItem('aroma_pos_last_num', nextNum);
            return 'ZAM-' + String(nextNum).padStart(3, '0');
        }

        function checkout(paymentMethod) {
            if (cart.length === 0) {
                alert('Koszyk jest pusty.');
                return;
            }

            const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            const now = new Date();
            const timeStr = now.toLocaleTimeString('pl-PL', {hour: '2-digit', minute:'2-digit', second:'2-digit'});
            const dateStr = now.toISOString().split('T')[0];
            const orderNum = getNextOrderNumber();

            const newOrder = {
                id: orderNum,
                time: timeStr,
                date: dateStr,
                items: [...cart],
                payment: paymentMethod,
                total: total
            };

            orderHistory.unshift(newOrder);
            localStorage.setItem('aroma_pos_history', JSON.stringify(orderHistory));

            cart = [];
            renderCart();
            renderHistory();
            switchTab('history');
        }

        function renderHistory() {
            const tbody = document.getElementById('history-table-body');
            const query = document.getElementById('history-search')?.value.toLowerCase() || '';

            let filtered = orderHistory;
            if (query.trim() !== '') {
                filtered = orderHistory.filter(ord => 
                    String(ord.id).toLowerCase().includes(query) || 
                    ord.items.some(i => i.name.toLowerCase().includes(query))
                );
            }

            if (filtered.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="7" class="p-3 text-center text-coffee-600/60">
                            Brak zamówień.
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = filtered.map(ord => `
                <tr class="hover:bg-coffee-50/50 transition">
                    <td class="p-1.5 font-bold text-coffee-900">${ord.id}</td>
                    <td class="p-1.5 text-coffee-700">${ord.date} ${ord.time}</td>
                    <td class="p-1.5"><span class="px-1.5 py-0.5 bg-amber-100 text-amber-800 rounded text-[9px] font-semibold">Na miejscu</span></td>
                    <td class="p-1.5 text-coffee-800 text-[9px]">
                        ${ord.items.map(i => `${i.qty}x ${i.name}`).join(', ')}
                    </td>
                    <td class="p-1.5 text-coffee-700">${ord.payment}</td>
                    <td class="p-1.5 text-right font-bold text-coffee-900">${ord.total.toFixed(2)} zł</td>
                    <td class="p-1.5 text-center">
                        <button onclick="deleteOrder('${ord.id}', '${ord.time}')" class="p-1 bg-red-50 hover:bg-red-100 text-red-600 rounded transition" title="Usuń zamówienie">
                            <i class="fa-solid fa-trash-can text-[9px]"></i>
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        function filterHistory() {
            renderHistory();
        }

        function deleteOrder(orderId, orderTime) {
            if (confirm(`Usunąć zamówienie ${orderId}?`)) {
                orderHistory = orderHistory.filter(ord => !(ord.id === orderId && ord.time === orderTime));
                localStorage.setItem('aroma_pos_history', JSON.stringify(orderHistory));
                renderHistory();
            }
        }

        function clearHistory() {
            if (confirm('Wyczyścić całą historię?')) {
                orderHistory = [];
                localStorage.removeItem('aroma_pos_history');
                localStorage.removeItem('aroma_pos_last_num');
                renderHistory();
            }
        }

        function exportToCSV() {
            if (orderHistory.length === 0) {
                alert('Brak danych.');
                return;
            }

            let csvContent = "data:text/csv;charset=utf-8,\uFEFF";
            csvContent += "ID Zamówienia;Data;Godzina;Płatność;Wartość (PLN);Pozycje\n";

            orderHistory.forEach(ord => {
                const itemsStr = ord.items.map(i => `${i.qty}x ${i.name}`).join(' | ');
                const row = [ord.id, ord.date, ord.time, ord.payment, ord.total.toFixed(2), `"${itemsStr}"`];
                csvContent += row.join(";") + "\n";
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `kawiarnia_zamowienia_${new Date().toISOString().split('T')[0]}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function openDaySummaryModal() {
            const totalOrders = orderHistory.length;
            const totalRevenue = orderHistory.reduce((sum, o) => sum + o.total, 0);

            alert(`--- PODSUMOWANIE DNIA ---\n\nLiczba zamówień: ${totalOrders}\nCałkowity utarg: ${totalRevenue.toFixed(2)} zł`);
        }
    </script>
</body>
</html>
